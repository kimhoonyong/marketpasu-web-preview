name: Refresh public news (personal MVP)

on:
  # First deployment / updater changes can trigger an immediate news refresh.
  # News JSON commits do not match these paths, preventing a push loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-news-refresh.yml'
      - 'scripts/update-public-news.py'
  schedule:
    # UTC every four hours; KST is UTC+9. GitHub cron start can be delayed.
    - cron: '15 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Offline syntax and RSS parser checks
        run: |
          node --check market/market.js
          node --check market/feed-model.mjs
          node --test tests/feed-model.test.mjs
          node --check market/news-quality.mjs
          node --test tests/news-quality.test.mjs
          node --test tests/late-news-risk.test.mjs
          node --check market/accumulation-evidence.mjs
          node --check market/minute-csv.mjs
          node --check market/flow-ui.mjs
          node --test tests/accumulation-evidence.test.mjs
          node --test tests/minute-csv.test.mjs
          node --check market/stock-hints.mjs
          node --check market/market-bar-cache.mjs
          node --check market/local-bar-store.mjs
          node --test tests/stock-cache.test.mjs
          node --check market/daily-support.mjs
          node --check market/daily-csv.mjs
          node --test tests/daily-support.test.mjs
          node --check market/cross-timeframe.mjs
          node --test tests/cross-timeframe.test.mjs
          node --check market/chart-model.mjs
          node --check market/candle-chart.mjs
          node --check market/auto-charts.mjs
          node --test tests/chart-model.test.mjs
          python3 -m py_compile scripts/update-public-news.py
          python3 -m unittest discover -s tests -p 'test_public_news.py' -v
          python3 -m py_compile integrations/kiwoom/rest_minutes.py
          python3 -m unittest discover -s tests -p 'test_kiwoom_minutes.py' -v
          python3 -m py_compile integrations/kiwoom/scout_preflight.py integrations/kiwoom/realtime_0b_observe.py
          python3 -m unittest discover -s tests -p 'test_kiwoom_scout_bridge.py' -v
          python3 -m py_compile integrations/kiwoom/rest_daily.py
          python3 -m unittest discover -s tests -p 'test_kiwoom_daily.py' -v
          python3 -m py_compile integrations/kiwoom/marketpasu_local_chart_server.py
          python3 -m unittest discover -s tests -p 'test_kiwoom_local_chart.py' -v
          python3 -m py_compile integrations/kiwoom/existing_rest_auth.py
          python3 -m unittest discover -s tests -p 'test_existing_theme_auth.py' -v
      - name: Refresh bounded public headline snapshot
        run: python3 scripts/update-public-news.py
      - name: Publish news snapshot only when changed
        run: |
          if git diff --quiet -- market/news.json market/history.json && [ -z "$(git ls-files --others --exclude-standard -- market/history.json)" ]; then
            echo 'Unchanged news snapshot. No publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- market/news.json market/history.json
          git commit -m 'Update public RSS headlines (personal market page)'
          git push
