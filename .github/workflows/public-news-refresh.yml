name: Refresh public news (personal MVP)

on:
  # First deployment / updater changes can trigger an immediate news refresh.
  # News JSON commits do not match these paths, preventing a push loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-news-refresh.yml'
      - 'scripts/update-public-news.py'
  schedule:
    # UTC every four hours; KST is UTC+9. GitHub cron start can be delayed.
    - cron: '15 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Offline syntax and RSS parser checks
        run: |
          node --check market/market.js
          python3 -m py_compile scripts/update-public-news.py
          python3 -m unittest discover -s tests -p 'test_public_news.py' -v
      - name: Refresh bounded public headline snapshot
        run: python3 scripts/update-public-news.py
      - name: Publish news snapshot only when changed
        run: |
          if git diff --quiet -- market/news.json; then
            echo 'Unchanged news snapshot. No publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- market/news.json
          git commit -m 'Update public RSS headlines (personal market page)'
          git push
